<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 360" role="img">
<title>Диаграмма вариантов использования</title>
<desc>Use Case-диаграмма системы интернет-магазина. Слева актор Клиент и Менеджер, в центре в рамке системы — овалы с функциями, справа внешняя система Платёжный шлюз.</desc>
<g transform="translate(80,90)">
<circle cx="0" cy="0" r="14" fill="none" stroke="#185FA5" stroke-width="1.5"/>
