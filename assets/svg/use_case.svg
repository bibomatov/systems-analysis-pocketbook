<text x="0" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#0C447C">Клиент</text>
</g>
<g transform="translate(80,250)">
<circle cx="0" cy="0" r="14" fill="none" stroke="#185FA5" stroke-width="1.5"/>
