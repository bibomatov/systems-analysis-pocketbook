<text x="0" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#0C447C">Менеджер</text>
</g>
<rect x="240" y="40" width="440" height="280" rx="20" fill="#FFFFFF" stroke="#444441" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="460" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#444441">Интернет-магазин</text>
<ellipse cx="380" cy="80" rx="100" ry="28" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
