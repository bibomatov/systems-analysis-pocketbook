<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 360" role="img">
<title>Базовые элементы BPMN</title>
<desc>Пять групп элементов BPMN: события, задачи, шлюзы, потоки и пулы с дорожками. Каждый элемент показан с подписью.</desc>
<defs>
<marker id="bpmn_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#444441"/>
</marker>
</defs>
<text x="60" y="40" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0C447C">События</text>
<circle cx="120" cy="90" r="22" fill="#FFFFFF" stroke="#185FA5" stroke-width="2"/>
<text x="120" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">Начало</text>
<circle cx="220" cy="90" r="22" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="220" cy="90" r="17" fill="none" stroke="#185FA5" stroke-width="1"/>
<text x="220" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">Промежуточное</text>
<circle cx="320" cy="90" r="22" fill="#FFFFFF" stroke="#185FA5" stroke-width="3"/>
<text x="320" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">Конец</text>
<text x="450" y="40" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#27500A">Задачи</text>
<rect x="430" y="68" width="120" height="44" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="490" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27500A">Принять</text>
<text x="490" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27500A">заявку</text>
<text x="490" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">Действие участника</text>
<text x="700" y="40" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#633806">Шлюзы</text>
<polygon points="760,68 800,90 760,112 720,90" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="760" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#854F0B">×</text>
<text x="760" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">Ветвление потока</text>
<text x="60" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#444441">Потоки</text>
<line x1="120" y1="240" x2="320" y2="240" stroke="#444441" stroke-width="2" marker-end="url(#bpmn_arr)"/>
<text x="220" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">Сплошная — последовательность (внутри пула)</text>
<line x1="120" y1="295" x2="320" y2="295" stroke="#444441" stroke-width="2" marker-end="url(#bpmn_arr)" stroke-dasharray="5,4"/>
<text x="220" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">Пунктирная — сообщение (между пулами)</text>
<text x="450" y="200" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#26215C">Пулы и дорожки</text>
<rect x="450" y="220" width="380" height="100" rx="4" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<rect x="450" y="220" width="30" height="100" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="465" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#26215C" transform="rotate(-90 465 270)">Пул</text>
<line x1="480" y1="270" x2="830" y2="270" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="2,2"/>
<rect x="480" y="220" width="20" height="50" fill="#F7F6FE" stroke="#534AB7" stroke-width="0.5"/>
<text x="490" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#26215C" transform="rotate(-90 490 248)">Дорожка А</text>
<rect x="480" y="270" width="20" height="50" fill="#F7F6FE" stroke="#534AB7" stroke-width="0.5"/>
<text x="490" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#26215C" transform="rotate(-90 490 298)">Дорожка Б</text>
<text x="640" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">Один участник = один пул, его подучастники = дорожки</text>
</svg>
