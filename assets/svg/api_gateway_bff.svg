<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 540" role="img">
<title>API Gateway и BFF</title>
<desc>Два паттерна работы с микросервисами. API Gateway — единая точка входа с общими функциями: авторизация, rate limiting, маршрутизация. BFF — отдельный бэкенд под каждый тип клиента, собирает данные из микросервисов в удобной форме.</desc>
<defs>
<marker id="ag_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#444441"/>
</marker>
</defs>

<!-- Заголовок верхней части -->
<text x="460" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#791F1F">API Gateway: единая точка входа</text>

<!-- Клиенты слева -->
<rect x="40" y="55" width="100" height="32" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="90" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">Веб-клиент</text>
<rect x="40" y="105" width="100" height="32" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="90" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">Моб. клиент</text>
<rect x="40" y="155" width="100" height="32" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="90" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">Партнёр</text>

<!-- API Gateway -->
<rect x="240" y="80" width="180" height="90" rx="6" fill="#A32D2D" stroke="#791F1F" stroke-width="1.5"/>
<text x="330" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">API Gateway</text>
<text x="330" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF">Авторизация · Rate limiting</text>
<text x="330" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF">Маршрутизация · TLS</text>
<text x="330" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#FFFFFF">Логи · Кэш · Метрики</text>

<!-- Стрелки от клиентов к Gateway -->
<line x1="140" y1="71" x2="238" y2="100" stroke="#444441" stroke-width="1.2" marker-end="url(#ag_arr)"/>
<line x1="140" y1="121" x2="238" y2="125" stroke="#444441" stroke-width="1.2" marker-end="url(#ag_arr)"/>
<line x1="140" y1="171" x2="238" y2="150" stroke="#444441" stroke-width="1.2" marker-end="url(#ag_arr)"/>

<!-- Микросервисы справа -->
<rect x="540" y="55" width="120" height="32" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="600" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27500A">Заказы</text>
<rect x="540" y="100" width="120" height="32" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="600" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27500A">Платежи</text>
<rect x="540" y="145" width="120" height="32" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="600" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27500A">Каталог</text>
<rect x="540" y="190" width="120" height="32" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="600" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27500A">Уведомления</text>

<!-- Стрелки от Gateway к сервисам -->
<line x1="420" y1="105" x2="538" y2="71" stroke="#444441" stroke-width="1" marker-end="url(#ag_arr)"/>
<line x1="420" y1="115" x2="538" y2="116" stroke="#444441" stroke-width="1" marker-end="url(#ag_arr)"/>
<line x1="420" y1="135" x2="538" y2="161" stroke="#444441" stroke-width="1" marker-end="url(#ag_arr)"/>
<line x1="420" y1="145" x2="538" y2="206" stroke="#444441" stroke-width="1" marker-end="url(#ag_arr)"/>

<text x="460" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">Все клиенты ходят через шлюз. Сервисы не возятся с авторизацией и сертификатами.</text>

<!-- Разделитель -->
<line x1="40" y1="275" x2="880" y2="275" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4,3"/>

<!-- Заголовок нижней части -->
<text x="460" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#27500A">BFF: свой бэкенд под каждого клиента</text>

<!-- Клиенты -->
<rect x="40" y="330" width="100" height="32" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="90" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">Веб-клиент</text>
<rect x="40" y="380" width="100" height="32" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="90" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">Моб. клиент</text>
<rect x="40" y="430" width="100" height="32" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="90" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">Партнёр</text>

<!-- BFF под каждого -->
<rect x="240" y="330" width="120" height="32" rx="4" fill="#7A9C44" stroke="#3B6D11" stroke-width="1"/>
<text x="300" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">BFF: Web</text>
<rect x="240" y="380" width="120" height="32" rx="4" fill="#7A9C44" stroke="#3B6D11" stroke-width="1"/>
<text x="300" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">BFF: Mobile</text>
<rect x="240" y="430" width="120" height="32" rx="4" fill="#7A9C44" stroke="#3B6D11" stroke-width="1"/>
<text x="300" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">BFF: Partner</text>

<!-- Стрелки клиент → свой BFF -->
<line x1="140" y1="346" x2="238" y2="346" stroke="#444441" stroke-width="1.2" marker-end="url(#ag_arr)"/>
<line x1="140" y1="396" x2="238" y2="396" stroke="#444441" stroke-width="1.2" marker-end="url(#ag_arr)"/>
<line x1="140" y1="446" x2="238" y2="446" stroke="#444441" stroke-width="1.2" marker-end="url(#ag_arr)"/>

<!-- Микросервисы -->
<rect x="540" y="335" width="120" height="28" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="600" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27500A">Заказы</text>
<rect x="540" y="375" width="120" height="28" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="600" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27500A">Платежи</text>
<rect x="540" y="415" width="120" height="28" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="600" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27500A">Каталог</text>
<rect x="540" y="455" width="120" height="28" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="600" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27500A">Уведомления</text>

<!-- Стрелки от каждого BFF к нескольким сервисам -->
<line x1="360" y1="346" x2="538" y2="349" stroke="#444441" stroke-width="0.8" marker-end="url(#ag_arr)"/>
<line x1="360" y1="346" x2="538" y2="389" stroke="#444441" stroke-width="0.8" marker-end="url(#ag_arr)"/>
<line x1="360" y1="346" x2="538" y2="429" stroke="#444441" stroke-width="0.8" marker-end="url(#ag_arr)"/>

<line x1="360" y1="396" x2="538" y2="389" stroke="#444441" stroke-width="0.8" marker-end="url(#ag_arr)"/>
<line x1="360" y1="396" x2="538" y2="429" stroke="#444441" stroke-width="0.8" marker-end="url(#ag_arr)"/>

<line x1="360" y1="446" x2="538" y2="349" stroke="#444441" stroke-width="0.8" marker-end="url(#ag_arr)"/>
<line x1="360" y1="446" x2="538" y2="469" stroke="#444441" stroke-width="0.8" marker-end="url(#ag_arr)"/>

<text x="460" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">Каждый BFF собирает свой набор данных из нужных сервисов и отдаёт в форме, удобной клиенту.</text>
<text x="460" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">Часто работают вместе: Клиент → API Gateway → BFF → микросервисы.</text>
</svg>
