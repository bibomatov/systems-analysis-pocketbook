<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 540" role="img">
<title>Устройство Kafka</title>
<desc>Топик из трёх партиций. Producer публикует сообщения с ключами, Kafka распределяет их по партициям через хеш ключа. Две consumer groups читают топик независимо: у каждой свои оффсеты.</desc>
<defs>
<marker id="kafka_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#444441"/>
</marker>
</defs>
