<text x="60" y="500" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#444441">Ключевые свойства:</text>
<text x="60" y="518" font-family="Arial, sans-serif" font-size="10" fill="#444441">• Каждая consumer group имеет независимый оффсет — обе группы получают все сообщения, но независимо друг от друга</text>
