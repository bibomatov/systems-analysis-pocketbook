<text x="100" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0C447C">с ключом</text>
<line x1="160" y1="220" x2="218" y2="180" stroke="#444441" stroke-width="1.5" marker-end="url(#kafka_arr)"/>
