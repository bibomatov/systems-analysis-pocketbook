<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 380" role="img">
<title>Типы JOIN: визуальное представление</title>
<desc>Четыре типа JOIN на кругах Венна: INNER (только пересечение), LEFT (вся левая таблица), RIGHT (вся правая), FULL (обе таблицы целиком). Закрашенная область показывает, какие записи попадают в результат.</desc>
<defs>
<clipPath id="clipA1"><circle cx="180" cy="160" r="60"/></clipPath>
<clipPath id="clipB1"><circle cx="240" cy="160" r="60"/></clipPath>
<clipPath id="clipA2"><circle cx="400" cy="160" r="60"/></clipPath>
<clipPath id="clipB2"><circle cx="460" cy="160" r="60"/></clipPath>
<clipPath id="clipA3"><circle cx="620" cy="160" r="60"/></clipPath>
<clipPath id="clipB3"><circle cx="680" cy="160" r="60"/></clipPath>
</defs>
<text x="210" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0C447C">INNER JOIN</text>
<text x="210" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">только пересечение</text>
<g clip-path="url(#clipA1)">
<rect x="120" y="100" width="180" height="120" fill="#FFFFFF"/>
<circle cx="240" cy="160" r="60" fill="#185FA5" opacity="0.55"/>
</g>
<circle cx="180" cy="160" r="60" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="240" cy="160" r="60" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<text x="160" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0C447C">A</text>
<text x="260" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0C447C">B</text>
<text x="210" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">записи, где совпадение</text>
<text x="210" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">есть в обеих таблицах</text>
<text x="430" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#27500A">LEFT JOIN</text>
<text x="430" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">вся левая таблица</text>
<circle cx="400" cy="160" r="60" fill="#3B6D11" opacity="0.55"/>
<g clip-path="url(#clipA2)">
<circle cx="460" cy="160" r="60" fill="#3B6D11" opacity="0.55"/>
</g>
<circle cx="400" cy="160" r="60" fill="none" stroke="#3B6D11" stroke-width="1.5"/>
<circle cx="460" cy="160" r="60" fill="none" stroke="#3B6D11" stroke-width="1.5"/>
<text x="380" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">A</text>
<text x="480" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#27500A">B</text>
<text x="430" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">все записи из A</text>
<text x="430" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">+ совпадения из B</text>
<text x="650" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">RIGHT JOIN</text>
<text x="650" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">вся правая таблица</text>
<circle cx="680" cy="160" r="60" fill="#854F0B" opacity="0.55"/>
<g clip-path="url(#clipB3)">
<circle cx="620" cy="160" r="60" fill="#854F0B" opacity="0.55"/>
</g>
<circle cx="620" cy="160" r="60" fill="none" stroke="#854F0B" stroke-width="1.5"/>
<circle cx="680" cy="160" r="60" fill="none" stroke="#854F0B" stroke-width="1.5"/>
<text x="600" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#633806">A</text>
<text x="700" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">B</text>
<text x="650" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">все записи из B</text>
<text x="650" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">+ совпадения из A</text>
<text x="430" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C">FULL JOIN — обе таблицы целиком</text>
<circle cx="400" cy="340" r="22" fill="#534AB7" opacity="0.55" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="430" cy="340" r="22" fill="#534AB7" opacity="0.55" stroke="#534AB7" stroke-width="1.5"/>
<text x="478" y="344" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">все записи из обеих таблиц со взаимными соответствиями;</text>
<text x="478" y="358" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">где соответствия нет — NULL с соответствующей стороны</text>
</svg>
