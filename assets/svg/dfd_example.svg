<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 360" role="img">
<title>Пример DFD</title>
<desc>Диаграмма потоков данных для обработки заявок. Внешняя сущность Клиент, два процесса: Принять заявку и Проверить заявку, два хранилища: заявки и решения, исходящий поток в почтовый сервис.</desc>
<defs>
<marker id="dfd_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#444441"/>
</marker>
</defs>
<rect x="40" y="140" width="120" height="60" rx="0" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="100" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0C447C">Клиент</text>
<text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">(внешняя сущность)</text>
<circle cx="280" cy="170" r="50" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="280" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27500A">Принять</text>
<text x="280" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27500A">заявку</text>
<line x1="160" y1="170" x2="227" y2="170" stroke="#444441" stroke-width="1.5" marker-end="url(#dfd_arr)"/>
<text x="193" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#444441" font-style="italic">данные заявки</text>
<rect x="380" y="80" width="160" height="50" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<line x1="380" y1="100" x2="540" y2="100" stroke="#854F0B" stroke-width="1.5"/>
<text x="460" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#633806">Хранилище заявок</text>
<line x1="320" y1="135" x2="380" y2="130" stroke="#444441" stroke-width="1.5" marker-end="url(#dfd_arr)"/>
<text x="335" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#444441" font-style="italic">записать</text>
<circle cx="640" cy="170" r="50" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text x="640" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27500A">Проверить</text>
<text x="640" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#27500A">заявку</text>
<line x1="540" y1="130" x2="595" y2="140" stroke="#444441" stroke-width="1.5" marker-end="url(#dfd_arr)"/>
<text x="585" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#444441" font-style="italic">прочитать</text>
<rect x="540" y="240" width="160" height="50" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<line x1="540" y1="260" x2="700" y2="260" stroke="#854F0B" stroke-width="1.5"/>
<text x="620" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#633806">Хранилище решений</text>
<line x1="640" y1="220" x2="620" y2="238" stroke="#444441" stroke-width="1.5" marker-end="url(#dfd_arr)"/>
<text x="660" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#444441" font-style="italic">решение</text>
<rect x="780" y="140" width="120" height="60" rx="0" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="840" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0C447C">Почтовый</text>
<text x="840" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0C447C">сервис</text>
<line x1="690" y1="170" x2="778" y2="170" stroke="#444441" stroke-width="1.5" marker-end="url(#dfd_arr)"/>
<text x="734" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#444441" font-style="italic">уведомление</text>
<text x="40" y="330" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#444441">Условные обозначения:</text>
<rect x="220" y="318" width="20" height="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="248" y="330" font-family="Arial, sans-serif" font-size="10" fill="#444441">внешняя сущность</text>
<circle cx="395" cy="325" r="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text x="412" y="330" font-family="Arial, sans-serif" font-size="10" fill="#444441">процесс</text>
<rect x="490" y="318" width="20" height="14" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<line x1="490" y1="323" x2="510" y2="323" stroke="#854F0B" stroke-width="1.5"/>
<text x="518" y="330" font-family="Arial, sans-serif" font-size="10" fill="#444441">хранилище</text>
<line x1="610" y1="325" x2="640" y2="325" stroke="#444441" stroke-width="1.5" marker-end="url(#dfd_arr)"/>
<text x="650" y="330" font-family="Arial, sans-serif" font-size="10" fill="#444441">поток данных</text>
</svg>
