<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 380" role="img">
<title>Вертикальная и горизонтальная декомпозиция</title>
<desc>Сравнение двух способов декомпозиции задачи. Слева — вертикальная: каждая подзадача охватывает все слои системы. Справа — горизонтальная: подзадачи разделены по слоям.</desc>
<text x="220" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#27500A">Вертикальная декомпозиция</text>
<text x="220" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">подзадачи режутся по функциям</text>
<rect x="60" y="80" width="100" height="180" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="110" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#27500A">Подзадача 1</text>
<rect x="72" y="115" width="76" height="34" rx="4" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="110" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">Интерфейс</text>
<rect x="72" y="155" width="76" height="34" rx="4" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="110" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">API</text>
<rect x="72" y="195" width="76" height="34" rx="4" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="110" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">БД</text>
<rect x="180" y="80" width="100" height="180" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="230" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#27500A">Подзадача 2</text>
<rect x="192" y="115" width="76" height="34" rx="4" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="230" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">Интерфейс</text>
<rect x="192" y="155" width="76" height="34" rx="4" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="230" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">API</text>
<rect x="192" y="195" width="76" height="34" rx="4" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="230" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">БД</text>
<rect x="300" y="80" width="100" height="180" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="350" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#27500A">Подзадача 3</text>
<rect x="312" y="115" width="76" height="34" rx="4" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="350" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">Интерфейс</text>
<rect x="312" y="155" width="76" height="34" rx="4" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="350" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">API</text>
<rect x="312" y="195" width="76" height="34" rx="4" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="350" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">БД</text>
<text x="220" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441" font-style="italic">Каждая подзадача — готовая</text>
<text x="220" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441" font-style="italic">функция от БД до интерфейса</text>
<text x="220" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27500A">Готовый результат после каждой подзадачи</text>
<line x1="460" y1="80" x2="460" y2="320" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<text x="700" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Горизонтальная декомпозиция</text>
<text x="700" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441">подзадачи режутся по слоям</text>
<rect x="540" y="115" width="320" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="555" y="136" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#0C447C">Подзадача 1</text>
<text x="700" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">Интерфейс целиком</text>
<rect x="540" y="155" width="320" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="555" y="176" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#0C447C">Подзадача 2</text>
<text x="700" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">API целиком</text>
<rect x="540" y="195" width="320" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="555" y="216" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#0C447C">Подзадача 3</text>
<text x="700" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">БД целиком</text>
<text x="700" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441" font-style="italic">Каждая подзадача —</text>
<text x="700" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441" font-style="italic">только один слой системы</text>
<text x="700" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">Результат — только после сборки всех слоёв</text>
</svg>
