<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 560" role="img">
<title>Идентификация, аутентификация, авторизация</title>
<desc>Три последовательных шага входа в систему. Идентификация — кто ты. Аутентификация — докажи. Авторизация — что тебе можно. Сверху показано на примере веб-системы, снизу — аналогия с офисом и пропусками.</desc>
<defs>
<marker id="auth_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#444441"/>
</marker>
</defs>

<text x="460" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Три шага входа в систему</text>

<!-- Шаг 1: Идентификация (веб-система) -->
<rect x="40" y="60" width="260" height="190" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
<text x="170" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#791F1F">1. Идентификация</text>
<text x="170" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#791F1F">«кто ты?»</text>

<rect x="60" y="120" width="220" height="55" rx="4" fill="#FFFFFF" stroke="#A32D2D" stroke-width="0.8"/>
<text x="75" y="138" font-family="Arial, sans-serif" font-size="10" fill="#444441">Login: ivan@example.com</text>
<text x="75" y="155" font-family="Arial, sans-serif" font-size="10" fill="#444441">Password: ●●●●●●●●●●</text>
<text x="75" y="170" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">пользователь заявляет себя</text>

<text x="170" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#791F1F">логин, email, ID, телефон</text>
<text x="170" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">просто заявление, ещё не подтверждено</text>

<!-- Стрелка -->
<line x1="300" y1="145" x2="328" y2="145" stroke="#444441" stroke-width="1.5" marker-end="url(#auth_arr)"/>

<!-- Шаг 2: Аутентификация -->
<rect x="330" y="60" width="260" height="190" rx="8" fill="#FAEFD9" stroke="#B07820" stroke-width="1.5"/>
<text x="460" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#7A4A0E">2. Аутентификация</text>
<text x="460" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#7A4A0E">«докажи»</text>

<rect x="350" y="120" width="220" height="55" rx="4" fill="#FFFFFF" stroke="#B07820" stroke-width="0.8"/>
<text x="365" y="138" font-family="Arial, sans-serif" font-size="10" fill="#444441">Сервер: hash(pass) =</text>
<text x="365" y="153" font-family="Arial, sans-serif" font-size="10" fill="#444441">       hash в БД?  OK</text>
<text x="365" y="168" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">+ 2FA по SMS / push</text>

<text x="460" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7A4A0E">пароль, SMS-код, отпечаток,</text>
<text x="460" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7A4A0E">сертификат</text>
<text x="460" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">факторы: знаю / имею / являюсь</text>

<!-- Стрелка -->
<line x1="590" y1="145" x2="618" y2="145" stroke="#444441" stroke-width="1.5" marker-end="url(#auth_arr)"/>

<!-- Шаг 3: Авторизация -->
<rect x="620" y="60" width="260" height="190" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text x="750" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#27500A">3. Авторизация</text>
<text x="750" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#27500A">«что тебе можно?»</text>

<rect x="640" y="120" width="220" height="55" rx="4" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.8"/>
<text x="655" y="138" font-family="Arial, sans-serif" font-size="10" fill="#444441">Роль: manager</text>
<text x="655" y="153" font-family="Arial, sans-serif" font-size="10" fill="#27500A">  read orders   разрешено</text>
<text x="655" y="168" font-family="Arial, sans-serif" font-size="10" fill="#791F1F">  delete users  запрещено</text>

<text x="750" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">роли, права, политики</text>
<text x="750" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">RBAC, ABAC</text>
<text x="750" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">решение «можно/нельзя» по операциям</text>

<!-- Разделитель -->
<line x1="40" y1="285" x2="880" y2="285" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4,3"/>

<!-- Аналогия с офисом -->
<text x="460" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#444441">Аналогия — пропуск в офис</text>

<!-- Шаг 1 аналогия -->
<rect x="40" y="335" width="260" height="190" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="1"/>
<text x="170" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#791F1F">Бейдж на ресепшне</text>
<text x="60" y="385" font-family="Arial, sans-serif" font-size="11" fill="#444441">Сотрудник:</text>
<text x="60" y="403" font-family="Arial, sans-serif" font-size="11" fill="#444441">«Я Иван Петров,</text>
<text x="60" y="421" font-family="Arial, sans-serif" font-size="11" fill="#444441">5-й отдел.»</text>
<text x="60" y="450" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">показывает бейдж,</text>
<text x="60" y="466" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">называет имя</text>
<text x="60" y="498" font-family="Arial, sans-serif" font-size="10" fill="#791F1F">это пока только заявление —</text>
<text x="60" y="514" font-family="Arial, sans-serif" font-size="10" fill="#791F1F">бейдж может быть чужим</text>

<line x1="300" y1="430" x2="328" y2="430" stroke="#444441" stroke-width="1.5" marker-end="url(#auth_arr)"/>

<!-- Шаг 2 аналогия -->
<rect x="330" y="335" width="260" height="190" rx="8" fill="#FFFFFF" stroke="#B07820" stroke-width="1"/>
<text x="460" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#7A4A0E">Турникет проверяет</text>
<text x="350" y="385" font-family="Arial, sans-serif" font-size="11" fill="#444441">Охранник:</text>
<text x="350" y="403" font-family="Arial, sans-serif" font-size="11" fill="#444441">сравнивает фото</text>
<text x="350" y="421" font-family="Arial, sans-serif" font-size="11" fill="#444441">с лицом, требует</text>
<text x="350" y="439" font-family="Arial, sans-serif" font-size="11" fill="#444441">приложить пропуск</text>
<text x="350" y="468" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">фото = «являюсь»</text>
<text x="350" y="484" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">пропуск = «имею»</text>
<text x="350" y="514" font-family="Arial, sans-serif" font-size="10" fill="#7A4A0E">проверка — это и есть аутентификация</text>

<line x1="590" y1="430" x2="618" y2="430" stroke="#444441" stroke-width="1.5" marker-end="url(#auth_arr)"/>

<!-- Шаг 3 аналогия -->
<rect x="620" y="335" width="260" height="190" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1"/>
<text x="750" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#27500A">Куда пропуск пускает</text>
<text x="640" y="385" font-family="Arial, sans-serif" font-size="11" fill="#27500A">5 этаж — открыто</text>
<text x="640" y="405" font-family="Arial, sans-serif" font-size="11" fill="#27500A">переговорки — да</text>
<text x="640" y="425" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">8 этаж — нет</text>
<text x="640" y="445" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">серверная — нет</text>
<text x="640" y="475" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">пропуск Ивана</text>
<text x="640" y="491" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">даёт фиксированный набор прав</text>
<text x="640" y="514" font-family="Arial, sans-serif" font-size="10" fill="#27500A">даже если ты Иван — серверная закрыта</text>
</svg>
