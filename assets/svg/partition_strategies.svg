<text x="728" y="640" font-family="Arial, sans-serif" font-size="9" fill="#444441">08-30 · клиент 56</text>
<text x="40" y="700" font-family="Arial, sans-serif" font-size="11" fill="#26215C" font-style="italic">SELECT ... WHERE created_at &gt;= '2026-07-01' AND client_id = 42  →  только Q3 → subpart 0</text>
