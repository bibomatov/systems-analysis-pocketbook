<text x="190" y="654" font-family="Arial, sans-serif" font-size="9" fill="#444441">06-19 · клиент 88</text>
<rect x="310" y="592" width="120" height="80" rx="3" fill="#F7F6FE" stroke="#534AB7" stroke-width="0.7"/>
