<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 540" role="img">
<title>Polling vs Webhook</title>
<desc>Сравнение двух подходов: при polling клиент регулярно опрашивает сервер, большая часть запросов впустую. При webhook сервер сам уведомляет клиента сразу, как только событие произошло.</desc>
<defs>
<marker id="pw_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#444441"/>
</marker>
<marker id="pw_arr_dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M0,0 L10,5 L0,10" fill="none" stroke="#444441" stroke-width="1.5"/>
</marker>
</defs>
<text x="220" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#791F1F">Polling — клиент опрашивает</text>
<rect x="60" y="60" width="120" height="32" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="120" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#791F1F">Клиент</text>
<rect x="280" y="60" width="120" height="32" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="340" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#791F1F">Сервер</text>
<line x1="120" y1="92" x2="120" y2="450" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="340" y1="92" x2="340" y2="450" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="120" y1="120" x2="338" y2="120" stroke="#444441" stroke-width="1.2" marker-end="url(#pw_arr)"/>
<text x="230" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#444441">GET /status</text>
<line x1="338" y1="135" x2="122" y2="135" stroke="#444441" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pw_arr_dash)"/>
<text x="230" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">pending — пусто</text>
<line x1="120" y1="180" x2="338" y2="180" stroke="#444441" stroke-width="1.2" marker-end="url(#pw_arr)"/>
<text x="230" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#444441">GET /status</text>
<line x1="338" y1="195" x2="122" y2="195" stroke="#444441" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pw_arr_dash)"/>
<text x="230" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">pending — пусто</text>
<line x1="120" y1="240" x2="338" y2="240" stroke="#444441" stroke-width="1.2" marker-end="url(#pw_arr)"/>
<text x="230" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#444441">GET /status</text>
<line x1="338" y1="255" x2="122" y2="255" stroke="#444441" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pw_arr_dash)"/>
<text x="230" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">pending — пусто</text>
<line x1="320" y1="290" x2="360" y2="290" stroke="#27500A" stroke-width="2"/>
<text x="380" y="294" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#27500A">событие!</text>
<line x1="120" y1="325" x2="338" y2="325" stroke="#444441" stroke-width="1.5" marker-end="url(#pw_arr)"/>
<text x="230" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#444441">GET /status</text>
<line x1="338" y1="345" x2="122" y2="345" stroke="#27500A" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#pw_arr_dash)"/>
<text x="230" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#27500A">success</text>
<rect x="40" y="395" width="360" height="55" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="55" y="415" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#791F1F">Минусы:</text>
<text x="55" y="431" font-family="Arial, sans-serif" font-size="9" fill="#791F1F">• задержка — событие узнаётся на ближайшем опросе</text>
<text x="55" y="445" font-family="Arial, sans-serif" font-size="9" fill="#791F1F">• большинство запросов — впустую</text>
<line x1="460" y1="40" x2="460" y2="510" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>
<text x="700" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#27500A">Webhook — сервер уведомляет</text>
<rect x="540" y="60" width="120" height="32" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="600" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#27500A">Клиент</text>
<rect x="760" y="60" width="120" height="32" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="820" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#27500A">Сервер</text>
<line x1="600" y1="92" x2="600" y2="450" stroke="#3B6D11" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="820" y1="92" x2="820" y2="450" stroke="#3B6D11" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="600" y1="120" x2="818" y2="120" stroke="#444441" stroke-width="1.2" marker-end="url(#pw_arr)"/>
<text x="710" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#444441">регистрирую URL для уведомлений</text>
<text x="555" y="180" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#5F5E5A">клиент</text>
<text x="555" y="194" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#5F5E5A">занят своими</text>
<text x="555" y="208" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#5F5E5A">задачами,</text>
<text x="555" y="222" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#5F5E5A">сервер ничего</text>
<text x="555" y="236" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#5F5E5A">не присылает</text>
<line x1="800" y1="290" x2="840" y2="290" stroke="#27500A" stroke-width="2"/>
<text x="730" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#27500A">событие!</text>
<line x1="818" y1="320" x2="602" y2="320" stroke="#27500A" stroke-width="1.5" marker-end="url(#pw_arr)"/>
<text x="710" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#27500A">POST /callback</text>
<text x="710" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#27500A">{event: success}</text>
<line x1="600" y1="350" x2="818" y2="350" stroke="#444441" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#pw_arr_dash)"/>
<text x="710" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">200 OK</text>
<rect x="520" y="395" width="360" height="55" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="535" y="415" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#27500A">Плюсы:</text>
<text x="535" y="431" font-family="Arial, sans-serif" font-size="9" fill="#27500A">• минимальная задержка — клиент узнаёт сразу</text>
<text x="535" y="445" font-family="Arial, sans-serif" font-size="9" fill="#27500A">• нет лишних запросов, нагрузка только при событиях</text>
<text x="460" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441" font-style="italic">Время идёт сверху вниз. Каждая стрелка — это HTTP-запрос.</text>
</svg>
