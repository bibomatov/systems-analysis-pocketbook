<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 460" role="img">
<title>Устройство RabbitMQ</title>
<desc>Producer отправляет сообщение в Exchange, который по правилам binding маршрутизирует его в одну или несколько Queues, где сообщение забирает Consumer.</desc>
<defs>
<marker id="rmq_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#444441"/>
</marker>
</defs>
<rect x="40" y="170" width="120" height="80" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="100" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0C447C">Producer</text>
<text x="100" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">отправляет с</text>
<text x="100" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">routing key</text>
<line x1="160" y1="210" x2="218" y2="210" stroke="#444441" stroke-width="1.5" marker-end="url(#rmq_arr)"/>
<text x="189" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">routing key:</text>
<text x="189" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">"orders.created.eu"</text>
<rect x="220" y="170" width="160" height="80" rx="40" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
<text x="300" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#633806">Exchange</text>
<text x="300" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#633806">тип: topic</text>
<text x="300" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">маршрутизирует</text>
<line x1="380" y1="190" x2="540" y2="120" stroke="#854F0B" stroke-width="1.2" marker-end="url(#rmq_arr)"/>
<text x="455" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">binding</text>
<text x="455" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">"orders.created.*"</text>
<line x1="380" y1="210" x2="540" y2="210" stroke="#854F0B" stroke-width="1.2" marker-end="url(#rmq_arr)"/>
<text x="460" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">binding "orders.*.eu"</text>
<line x1="380" y1="230" x2="540" y2="300" stroke="#854F0B" stroke-width="1.2" marker-end="url(#rmq_arr)"/>
<text x="455" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">binding</text>
<text x="455" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">"orders.#"</text>
<rect x="540" y="90" width="140" height="48" rx="22" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1.5"/>
<rect x="552" y="100" width="12" height="28" rx="2" fill="#3B6D11"/>
<rect x="568" y="100" width="12" height="28" rx="2" fill="#3B6D11" opacity="0.7"/>
<text x="630" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#27500A">warehouse_queue</text>
<rect x="540" y="186" width="140" height="48" rx="22" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1.5"/>
<rect x="552" y="196" width="12" height="28" rx="2" fill="#3B6D11"/>
<rect x="568" y="196" width="12" height="28" rx="2" fill="#3B6D11" opacity="0.7"/>
<text x="630" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#27500A">analytics_eu_queue</text>
<rect x="540" y="282" width="140" height="48" rx="22" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1.5"/>
<rect x="552" y="292" width="12" height="28" rx="2" fill="#3B6D11"/>
<rect x="568" y="292" width="12" height="28" rx="2" fill="#3B6D11" opacity="0.7"/>
<rect x="584" y="292" width="12" height="28" rx="2" fill="#3B6D11" opacity="0.4"/>
<text x="640" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#27500A">audit_queue</text>
<line x1="680" y1="114" x2="718" y2="114" stroke="#444441" stroke-width="1.5" marker-end="url(#rmq_arr)"/>
<rect x="720" y="92" width="120" height="44" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="780" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#27500A">Consumer</text>
<text x="780" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">склад</text>
<line x1="680" y1="210" x2="718" y2="210" stroke="#444441" stroke-width="1.5" marker-end="url(#rmq_arr)"/>
<rect x="720" y="188" width="120" height="44" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="780" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#27500A">Consumer</text>
<text x="780" y="223" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">аналитика</text>
<line x1="680" y1="306" x2="718" y2="306" stroke="#444441" stroke-width="1.5" marker-end="url(#rmq_arr)"/>
<rect x="720" y="284" width="120" height="44" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="780" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#27500A">Consumer</text>
<text x="780" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">журнал</text>
<rect x="40" y="370" width="800" height="70" rx="4" fill="#FAF9F5" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="60" y="392" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#444441">Ключевые свойства:</text>
<text x="60" y="412" font-family="Arial, sans-serif" font-size="10" fill="#444441">• Сообщение исчезает из очереди после подтверждения потребителем (basic.ack)</text>
<text x="60" y="428" font-family="Arial, sans-serif" font-size="10" fill="#444441">• Несколько потребителей на одной очереди — балансировка round-robin (одно сообщение → один потребитель)</text>
</svg>
