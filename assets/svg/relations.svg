<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 700" role="img">
<title>Виды связей между таблицами</title>
<desc>Три типа связей: один к одному, один ко многим, многие ко многим. Для каждой показан пример с реальными таблицами и связями через ключи.</desc>
