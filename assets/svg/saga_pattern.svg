<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 540" role="img">
<title>Паттерн Saga</title>
<desc>Saga «Оформить заказ» из четырёх шагов. Прямой путь — слева направо. На шаге 3 происходит сбой: товара нет на складе. Запускаются компенсации шагов 2 и 1 в обратном порядке: вернуть деньги, отменить заказ. Шаг 4 не выполнялся — компенсация не нужна.</desc>
<defs>
<marker id="sg_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#3B6D11"/>
</marker>
<marker id="sg_arr_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#A32D2D"/>
</marker>
<marker id="sg_arr_gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#B4B2A9"/>
</marker>
</defs>

<text x="460" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#444441">Saga «Оформить заказ»: сбой на шаге 3</text>

<!-- Заголовок прямого пути -->
<text x="40" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#27500A">Прямой путь</text>

<!-- Шаг 1 -->
<rect x="40" y="85" width="180" height="60" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text x="130" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#27500A">Шаг 1</text>
<text x="130" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27500A">Создать заказ</text>
<text x="130" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">сервис «Заказы»</text>

<line x1="220" y1="115" x2="258" y2="115" stroke="#3B6D11" stroke-width="1.8" marker-end="url(#sg_arr)"/>

<!-- Шаг 2 -->
<rect x="260" y="85" width="180" height="60" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text x="350" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#27500A">Шаг 2</text>
<text x="350" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#27500A">Списать деньги</text>
<text x="350" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">сервис «Платежи»</text>

<line x1="440" y1="115" x2="478" y2="115" stroke="#3B6D11" stroke-width="1.8" marker-end="url(#sg_arr)"/>

<!-- Шаг 3 — сбой -->
<rect x="480" y="85" width="180" height="60" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/>
<text x="570" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#791F1F">Шаг 3 — СБОЙ</text>
<text x="570" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">Зарезервировать товар</text>
<text x="570" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#791F1F" font-style="italic">товара нет на складе</text>

<line x1="660" y1="115" x2="698" y2="115" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#sg_arr_gray)"/>

<!-- Шаг 4 — не выполнялся -->
<rect x="700" y="85" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4,3"/>
<text x="790" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#B4B2A9">Шаг 4</text>
<text x="790" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#B4B2A9">Создать доставку</text>
<text x="790" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#B4B2A9" font-style="italic">не выполнялся</text>

<!-- Стрелка вниз от сбоя -->
<line x1="570" y1="155" x2="570" y2="220" stroke="#A32D2D" stroke-width="2" marker-end="url(#sg_arr_red)"/>
<text x="600" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#791F1F">запускаются компенсации</text>
<text x="600" y="210" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">в обратном порядке</text>

<!-- Заголовок компенсаций -->
<text x="40" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#791F1F">Компенсации</text>

<!-- Компенсация 4 — пустая -->
<rect x="700" y="285" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4,3"/>
<text x="790" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#B4B2A9">Компенсация 4</text>
<text x="790" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#B4B2A9">Отменить доставку</text>
<text x="790" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#B4B2A9" font-style="italic">не нужна</text>

<!-- Компенсация 3 — пустая (сам шаг упал) -->
<rect x="480" y="285" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4,3"/>
<text x="570" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#B4B2A9">Компенсация 3</text>
<text x="570" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#B4B2A9">Освободить резерв</text>
<text x="570" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#B4B2A9" font-style="italic">шаг 3 упал — нечего откатывать</text>

<line x1="478" y1="315" x2="442" y2="315" stroke="#A32D2D" stroke-width="1.8" marker-end="url(#sg_arr_red)"/>

<!-- Компенсация 2 -->
<rect x="260" y="285" width="180" height="60" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
<text x="350" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#791F1F">Компенсация 2</text>
<text x="350" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">Вернуть деньги</text>
<text x="350" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">сервис «Платежи»</text>

<line x1="258" y1="315" x2="222" y2="315" stroke="#A32D2D" stroke-width="1.8" marker-end="url(#sg_arr_red)"/>

<!-- Компенсация 1 -->
<rect x="40" y="285" width="180" height="60" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
<text x="130" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#791F1F">Компенсация 1</text>
<text x="130" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#791F1F">Отменить заказ</text>
<text x="130" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5F5E5A" font-style="italic">сервис «Заказы»</text>

<!-- Линия результата -->
<line x1="40" y1="395" x2="880" y2="395" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3,3"/>

<rect x="40" y="415" width="840" height="100" rx="6" fill="#FFFAF0" stroke="#B07820" stroke-width="1"/>
<text x="60" y="438" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#7A4A0E">Что важно понимать:</text>
<text x="60" y="458" font-family="Arial, sans-serif" font-size="10" fill="#444441">• Компенсация — не ROLLBACK базы, а явное бизнес-действие. «Вернуть деньги» — отдельная операция, своя запись в БД.</text>
<text x="60" y="475" font-family="Arial, sans-serif" font-size="10" fill="#444441">• Компенсации идут в обратном порядке: сначала откатываем последний выполненный шаг, потом предыдущие.</text>
<text x="60" y="492" font-family="Arial, sans-serif" font-size="10" fill="#444441">• Между шагами система временно несогласована: деньги уже списаны, товар ещё не зарезервирован. Это плата за распределённость.</text>
<text x="60" y="509" font-family="Arial, sans-serif" font-size="10" fill="#444441">• Компенсации должны быть идемпотентными — могут вызваться повторно при сбоях.</text>
</svg>
