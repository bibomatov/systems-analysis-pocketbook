<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 540" role="img">
<title>Пример ER-диаграммы</title>
<desc>ER-диаграмма с четырьмя сущностями: Клиент, Заказ, Состав заказа, Товар. Связи в нотации вороньих лапок: один клиент к нулю или многим заказам, один заказ к одному или многим строкам состава, один товар к нулю или многим строкам состава.</desc>
<rect x="60" y="60" width="220" height="160" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.5"/>
<rect x="60" y="60" width="220" height="28" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="170" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0C447C">Клиент</text>
<line x1="60" y1="106" x2="280" y2="106" stroke="#185FA5" stroke-width="0.5"/>
<text x="78" y="100" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#185FA5">PK</text>
<text x="105" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="500" text-decoration="underline" fill="#0C447C">id</text>
<text x="78" y="128" font-family="Arial, sans-serif" font-size="11" fill="#444441">name</text>
<text x="78" y="148" font-family="Arial, sans-serif" font-size="11" fill="#444441">email</text>
<text x="78" y="168" font-family="Arial, sans-serif" font-size="11" fill="#444441">phone</text>
<text x="78" y="188" font-family="Arial, sans-serif" font-size="11" fill="#444441">created_at</text>
<rect x="60" y="320" width="220" height="160" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1.5"/>
<rect x="60" y="320" width="220" height="28" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text x="170" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#27500A">Заказ</text>
<line x1="60" y1="366" x2="280" y2="366" stroke="#3B6D11" stroke-width="0.5"/>
<text x="78" y="360" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#3B6D11">PK</text>
<text x="105" y="360" font-family="Arial, sans-serif" font-size="11" font-weight="500" text-decoration="underline" fill="#27500A">id</text>
<text x="78" y="388" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#3B6D11">FK</text>
<text x="105" y="388" font-family="Arial, sans-serif" font-size="11" fill="#444441">client_id</text>
<text x="78" y="408" font-family="Arial, sans-serif" font-size="11" fill="#444441">status</text>
<text x="78" y="428" font-family="Arial, sans-serif" font-size="11" fill="#444441">total</text>
<text x="78" y="448" font-family="Arial, sans-serif" font-size="11" fill="#444441">created_at</text>
<rect x="380" y="320" width="220" height="160" rx="6" fill="#FFFFFF" stroke="#854F0B" stroke-width="1.5"/>
<rect x="380" y="320" width="220" height="28" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<text x="490" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#633806">Состав заказа</text>
<line x1="380" y1="366" x2="600" y2="366" stroke="#854F0B" stroke-width="0.5"/>
<text x="398" y="360" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#854F0B">PK</text>
<text x="425" y="360" font-family="Arial, sans-serif" font-size="11" font-weight="500" text-decoration="underline" fill="#633806">id</text>
<text x="398" y="388" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#854F0B">FK</text>
<text x="425" y="388" font-family="Arial, sans-serif" font-size="11" fill="#444441">order_id</text>
<text x="398" y="408" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#854F0B">FK</text>
<text x="425" y="408" font-family="Arial, sans-serif" font-size="11" fill="#444441">product_id</text>
<text x="398" y="428" font-family="Arial, sans-serif" font-size="11" fill="#444441">quantity</text>
<text x="398" y="448" font-family="Arial, sans-serif" font-size="11" fill="#444441">price</text>
<rect x="700" y="320" width="200" height="160" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.5"/>
<rect x="700" y="320" width="200" height="28" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="800" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#26215C">Товар</text>
<line x1="700" y1="366" x2="900" y2="366" stroke="#534AB7" stroke-width="0.5"/>
<text x="718" y="360" font-family="Arial, sans-serif" font-size="9" font-weight="500" fill="#534AB7">PK</text>
<text x="745" y="360" font-family="Arial, sans-serif" font-size="11" font-weight="500" text-decoration="underline" fill="#26215C">id</text>
<text x="718" y="388" font-family="Arial, sans-serif" font-size="11" fill="#444441">name</text>
<text x="718" y="408" font-family="Arial, sans-serif" font-size="11" fill="#444441">sku</text>
<text x="718" y="428" font-family="Arial, sans-serif" font-size="11" fill="#444441">price</text>
<text x="718" y="448" font-family="Arial, sans-serif" font-size="11" fill="#444441">stock</text>
<line x1="170" y1="220" x2="170" y2="320" stroke="#444441" stroke-width="1.5"/>
<line x1="160" y1="240" x2="180" y2="240" stroke="#444441" stroke-width="1.5"/>
<line x1="160" y1="305" x2="180" y2="305" stroke="#444441" stroke-width="1.5"/>
<circle cx="170" cy="297" r="5" fill="#FFFFFF" stroke="#444441" stroke-width="1.5"/>
<line x1="160" y1="315" x2="170" y2="320" stroke="#444441" stroke-width="1.5"/>
<line x1="180" y1="315" x2="170" y2="320" stroke="#444441" stroke-width="1.5"/>
<text x="195" y="270" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">имеет</text>
<text x="195" y="248" font-family="Arial, sans-serif" font-size="10" fill="#444441">1 (ровно один)</text>
<text x="195" y="295" font-family="Arial, sans-serif" font-size="10" fill="#444441">0..N (ноль или много)</text>
<line x1="280" y1="400" x2="380" y2="400" stroke="#444441" stroke-width="1.5"/>
<line x1="295" y1="390" x2="295" y2="410" stroke="#444441" stroke-width="1.5"/>
<line x1="305" y1="390" x2="305" y2="410" stroke="#444441" stroke-width="1.5"/>
<line x1="365" y1="390" x2="365" y2="410" stroke="#444441" stroke-width="1.5"/>
<line x1="355" y1="390" x2="375" y2="400" stroke="#444441" stroke-width="1.5"/>
<line x1="355" y1="400" x2="375" y2="400" stroke="#444441" stroke-width="1.5"/>
<line x1="355" y1="410" x2="375" y2="400" stroke="#444441" stroke-width="1.5"/>
<text x="330" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">состоит из</text>
<text x="330" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#444441">1..N (один или много)</text>
<line x1="600" y1="400" x2="700" y2="400" stroke="#444441" stroke-width="1.5"/>
<line x1="615" y1="390" x2="635" y2="400" stroke="#444441" stroke-width="1.5"/>
<line x1="615" y1="400" x2="635" y2="400" stroke="#444441" stroke-width="1.5"/>
<line x1="615" y1="410" x2="635" y2="400" stroke="#444441" stroke-width="1.5"/>
<line x1="685" y1="390" x2="685" y2="410" stroke="#444441" stroke-width="1.5"/>
<text x="650" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" font-style="italic">ссылается на</text>
<text x="650" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#444441">N..1 (много на одного)</text>
<rect x="380" y="60" width="380" height="160" rx="4" fill="#FAF9F5" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="395" y="84" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#444441">Условные обозначения «вороньи лапки»:</text>
<line x1="395" y1="105" x2="425" y2="105" stroke="#444441" stroke-width="1.5"/>
<line x1="412" y1="98" x2="412" y2="112" stroke="#444441" stroke-width="1.5"/>
<text x="440" y="109" font-family="Arial, sans-serif" font-size="11" fill="#444441">— ровно один (1)</text>
<line x1="395" y1="130" x2="425" y2="130" stroke="#444441" stroke-width="1.5"/>
<line x1="412" y1="123" x2="412" y2="137" stroke="#444441" stroke-width="1.5"/>
<line x1="402" y1="123" x2="402" y2="137" stroke="#444441" stroke-width="1.5"/>
<text x="440" y="134" font-family="Arial, sans-serif" font-size="11" fill="#444441">— один или больше (1..N)</text>
<line x1="395" y1="155" x2="425" y2="155" stroke="#444441" stroke-width="1.5"/>
<line x1="402" y1="148" x2="422" y2="155" stroke="#444441" stroke-width="1.5"/>
<line x1="402" y1="155" x2="422" y2="155" stroke="#444441" stroke-width="1.5"/>
<line x1="402" y1="162" x2="422" y2="155" stroke="#444441" stroke-width="1.5"/>
<text x="440" y="159" font-family="Arial, sans-serif" font-size="11" fill="#444441">— много (N) — «лапка»</text>
<line x1="395" y1="180" x2="425" y2="180" stroke="#444441" stroke-width="1.5"/>
<circle cx="412" cy="180" r="5" fill="#FFFFFF" stroke="#444441" stroke-width="1.5"/>
<text x="440" y="184" font-family="Arial, sans-serif" font-size="11" fill="#444441">— ноль (необязательная связь)</text>
<text x="395" y="207" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A" font-style="italic">Знаки на концах линии читаются ближе к своей сущности</text>
</svg>
