<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 480" role="img">
<title>Четыре уровня C4</title>
<desc>Четыре уровня детализации в C4: контекст, контейнеры, компоненты, код. Каждый уровень — это вложенный взгляд на тот же объект.</desc>
<defs>
<marker id="c4_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0,0 L10,5 L0,10 Z" fill="#444441"/>
</marker>
</defs>
<rect x="40" y="40" width="200" height="180" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="140" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#0C447C">Уровень 1</text>
<text x="140" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#0C447C">Контекст</text>
<rect x="100" y="100" width="80" height="40" rx="4" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
<text x="140" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">Система</text>
<g transform="translate(60,170)">
