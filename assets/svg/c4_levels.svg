<line x1="424" y1="132" x2="424" y2="148" stroke="#444441" stroke-width="1" marker-end="url(#c4_arr)"/>
<line x1="378" y1="164" x2="384" y2="164" stroke="#444441" stroke-width="1" marker-start="url(#c4_arr)"/>
<text x="380" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441" font-style="italic">Из чего собрано</text>
<text x="380" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">для команд и архитекторов</text>
<rect x="520" y="40" width="200" height="180" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<text x="620" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#633806">Уровень 3</text>
<text x="620" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#633806">Компоненты</text>
<text x="620" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#633806" font-style="italic">внутри контейнера API</text>
<rect x="540" y="115" width="160" height="22" rx="2" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/>
<text x="620" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#633806">OrderController</text>
<rect x="540" y="143" width="160" height="22" rx="2" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/>
<text x="620" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#633806">OrderService</text>
<rect x="540" y="171" width="160" height="22" rx="2" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/>
<text x="620" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#633806">OrderRepository</text>
<line x1="620" y1="137" x2="620" y2="143" stroke="#444441" stroke-width="1" marker-end="url(#c4_arr)"/>
<line x1="620" y1="165" x2="620" y2="171" stroke="#444441" stroke-width="1" marker-end="url(#c4_arr)"/>
<text x="620" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441" font-style="italic">Внутри одного контейнера</text>
<text x="620" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">для разработчиков</text>
<rect x="760" y="40" width="140" height="180" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text x="830" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#26215C">Уровень 4</text>
<text x="830" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#26215C">Код</text>
<text x="830" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#26215C" font-style="italic">классы</text>
<text x="830" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#26215C" font-style="italic">и методы</text>
<text x="830" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">в коде или</text>
<text x="830" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">генерируется</text>
<text x="830" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441" font-style="italic">Редко рисуется</text>
<text x="830" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">отдельно</text>
<text x="40" y="320" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#444441">Принцип:</text>
<text x="40" y="345" font-family="Arial, sans-serif" font-size="12" fill="#444441">каждый уровень — это «приближение» к тому же объекту, со своей аудиторией</text>
<text x="40" y="368" font-family="Arial, sans-serif" font-size="12" fill="#444441">и своим словарём. На одной диаграмме не смешиваются элементы разных уровней.</text>
