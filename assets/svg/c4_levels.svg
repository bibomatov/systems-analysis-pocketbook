<line x1="0" y1="20" x2="6" y2="30" stroke="#0C447C" stroke-width="1"/>
<text x="0" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0C447C">Пользователь</text>
</g>
<rect x="180" y="170" width="50" height="30" rx="2" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
<text x="205" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0C447C">Внешняя</text>
<line x1="80" y1="170" x2="105" y2="142" stroke="#444441" stroke-width="1"/>
<line x1="180" y1="170" x2="170" y2="142" stroke="#444441" stroke-width="1"/>
<text x="140" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#444441" font-style="italic">Система целиком</text>
<text x="140" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">для бизнеса и менеджмента</text>
<rect x="280" y="40" width="200" height="180" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text x="380" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#27500A">Уровень 2</text>
<text x="380" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#27500A">Контейнеры</text>
