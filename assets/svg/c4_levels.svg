<text x="338" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27500A">БД</text>
<text x="338" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27500A">[PostgreSQL]</text>
<rect x="384" y="148" width="80" height="32" rx="3" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1"/>
