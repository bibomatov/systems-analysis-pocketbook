name: Сборка и публикация книги

# Триггеры:
# - push в main (после merge PR с правкой)
# - ручной запуск через Actions UI
on:
  push:
    branches: [main]
  workflow_dispatch:

# Разрешения для деплоя на Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Один деплой за раз — отменяем предыдущий, если он ещё идёт
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Сборка pocket-book.html
    runs-on: ubuntu-latest
    steps:
      - name: Чекаут репо
        uses: actions/checkout@v5

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Валидация HTML
        run: python3 build.py --check

      - name: Сборка книги
        run: python3 build.py

      - name: Подготовка артефактов для Pages
        run: |
          # Собранная книга становится корневым index.html сайта.
          # Все meta-документы копируются в /meta/ для доступа по URL.
          mkdir -p _site/meta
          cp pocket-book.html _site/index.html
          cp styles.css _site/styles.css
          cp glossary.html _site/glossary.html 2>/dev/null || true
          cp -r meta/*.html _site/meta/ 2>/dev/null || true
          cp -r meta/*.md _site/meta/ 2>/dev/null || true

      # TODO: проверять каждые 3 месяца, не появились ли Node 24 версии.
      # Следующая проверка: август 2026.
      # Когда GitHub выпустит upload-pages-artifact@v4 и deploy-pages@v5 на Node 24 —
      # обновить здесь и убрать этот комментарий.
      # Отслеживание: https://github.com/actions/upload-pages-artifact/issues/138
      - name: Загрузка артефакта Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Деплой на GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Деплой
        id: deployment
        uses: actions/deploy-pages@v4
